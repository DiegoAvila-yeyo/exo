<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" role="img" aria-labelledby="title desc">
  <title id="title">M8 merged binary component diagram</title>
  <desc id="desc">Draft component diagram for the exo M8 merged binary showing browser chat and terminal flows into termserver, the adapter, the agent stack, and PTY sessions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf6ee"/>
      <stop offset="100%" stop-color="#eef7fb"/>
    </linearGradient>
    <style>
      .title { font: 700 42px Georgia, serif; fill: #1e1b18; }
      .subtitle { font: 400 20px Georgia, serif; fill: #5e5348; }
      .groupTitle { font: 700 28px Georgia, serif; fill: #1e1b18; }
      .boxTitle { font: 700 22px Georgia, serif; fill: #1e1b18; }
      .body { font: 400 17px Georgia, serif; fill: #342d27; }
      .small { font: 400 15px Georgia, serif; fill: #5e5348; }
      .badge { font: 700 18px Georgia, serif; fill: #fffdf8; }
      .light { fill: #fffdfa; stroke: #8e7f72; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#5e5348"/>
    </marker>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#245f84"/>
    </marker>
    <marker id="arrowRed" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#8d3922"/>
    </marker>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="70" y="82" class="title">M8 Merged Binary Draft</text>
  <text x="70" y="116" class="subtitle">Browser chat and terminal control share one hardened exo backend while the agent stack runs in-process through an adapter.</text>

  <g transform="translate(70,170)">
    <rect x="0" y="0" width="250" height="220" rx="28" ry="28" fill="#d46a4b"/>
    <circle cx="52" cy="52" r="28" fill="#8d3922"/>
    <text x="40" y="59" class="badge">UI</text>
    <text x="98" y="48" class="groupTitle" fill="#fffdf8">Browser</text>
    <text x="34" y="102" class="body" fill="#fff7f1">Chat panel</text>
    <text x="34" y="134" class="body" fill="#fff7f1">Approval modal</text>
    <text x="34" y="166" class="body" fill="#fff7f1">xterm terminal tab</text>
    <text x="34" y="198" class="small" fill="#ffe7dc">POST chat + approve</text>
    <text x="34" y="220" class="small" fill="#ffe7dc">GET SSE + terminal WS</text>
  </g>

  <g transform="translate(390,150)">
    <rect x="0" y="0" width="1140" height="720" rx="34" ry="34" fill="#fffdfa" stroke="#8e7f72" stroke-width="3"/>
    <text x="42" y="54" class="groupTitle">launchd-activated exo backend</text>
    <text x="42" y="84" class="small">single process, singleton, same origin and CSRF boundary</text>

    <g transform="translate(40,120)">
      <rect x="0" y="0" width="330" height="230" rx="24" ry="24" fill="#e9a44c"/>
      <text x="28" y="42" class="boxTitle">termserver</text>
      <text x="28" y="78" class="body">HTTP routes:</text>
      <text x="28" y="108" class="small">`POST /api/chat`</text>
      <text x="28" y="132" class="small">`GET /api/chat/stream` SSE</text>
      <text x="28" y="156" class="small">`POST /api/approve`</text>
      <text x="28" y="180" class="small">`GET /api/sessions`</text>
      <text x="28" y="204" class="small">`GET /api/terminal/:id/stream` WS</text>
      <text x="28" y="228" class="small">strict Origin + CSRF on POST</text>
    </g>

    <g transform="translate(420,120)">
      <rect x="0" y="0" width="310" height="230" rx="24" ry="24" fill="#6ba4c8"/>
      <text x="28" y="42" class="boxTitle">chat transport state</text>
      <text x="28" y="78" class="body">single-flight turn lock</text>
      <text x="28" y="108" class="body">SSE broadcaster</text>
      <text x="28" y="138" class="body">pending approval channel</text>
      <text x="28" y="168" class="body">runner injection point</text>
      <text x="28" y="204" class="small">same AgentRunner contract as old dashboard</text>
    </g>

    <g transform="translate(780,120)">
      <rect x="0" y="0" width="310" height="230" rx="24" ry="24" fill="#7fbe7a"/>
      <text x="28" y="42" class="boxTitle">nucleo-base stack</text>
      <text x="28" y="78" class="body">provider</text>
      <text x="28" y="108" class="body">runtime coordinator</text>
      <text x="28" y="138" class="body">agent loop</text>
      <text x="28" y="168" class="body">tool registry</text>
      <text x="28" y="204" class="small">provider config from launchd env</text>
    </g>

    <g transform="translate(40,410)">
      <rect x="0" y="0" width="500" height="250" rx="24" ry="24" fill="#d7dfeb"/>
      <text x="28" y="42" class="boxTitle">terminal adapter</text>
      <text x="28" y="78" class="body">implements terminal tool interface</text>
      <text x="28" y="108" class="body">holds frozen agent lease per session</text>
      <text x="28" y="138" class="body">collector buffer + read cursor</text>
      <text x="28" y="168" class="body">maps SessionMeta / ToolEnvelope</text>
      <text x="28" y="198" class="body">lists only adapter-opened sessions</text>
      <text x="28" y="228" class="small">next write uses `WriteWithLease(agentLease, ...)`</text>
    </g>

    <g transform="translate(610,410)">
      <rect x="0" y="0" width="480" height="250" rx="24" ry="24" fill="#f0d7c4"/>
      <text x="28" y="42" class="boxTitle">exo terminal core</text>
      <text x="28" y="78" class="body">sessions.Manager</text>
      <text x="28" y="108" class="body">ptyactor.Session actor</text>
      <text x="28" y="138" class="body">realpty terminal</text>
      <text x="28" y="168" class="body">sessionstore cleanup-only recovery</text>
      <text x="28" y="204" class="small">browser takeover bumps epoch and closes stale subscribers</text>
    </g>

    <g transform="translate(610,690)">
      <rect x="0" y="0" width="480" height="110" rx="24" ry="24" class="light"/>
      <text x="28" y="42" class="boxTitle">PTY session</text>
      <text x="28" y="76" class="body">shell or command process group under one actor goroutine</text>
    </g>
  </g>

  <line x1="320" y1="240" x2="430" y2="240" stroke="#8d3922" stroke-width="5" marker-end="url(#arrowRed)"/>
  <text x="332" y="222" class="small">chat POST / approve POST</text>

  <line x1="320" y1="308" x2="430" y2="308" stroke="#245f84" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="332" y="290" class="small">SSE stream</text>

  <line x1="320" y1="360" x2="430" y2="360" stroke="#245f84" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="332" y="388" class="small">terminal WS per session</text>

  <line x1="720" y1="265" x2="820" y2="265" stroke="#5e5348" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="736" y="246" class="small">runner(ctx, msg)</text>

  <line x1="935" y1="380" x2="935" y2="410" stroke="#5e5348" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="950" y="400" class="small">terminal_* tool calls</text>

  <line x1="890" y1="535" x2="1000" y2="535" stroke="#5e5348" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="836" y="516" class="small">Open / Read / Write / Kill / List</text>

  <line x1="1150" y1="550" x2="1150" y2="690" stroke="#5e5348" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1164" y="634" class="small">PTY bytes</text>

  <line x1="1000" y1="535" x2="720" y2="535" stroke="#245f84" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrowBlue)"/>
  <text x="756" y="574" class="small">ToolEnvelope + output chunks</text>

  <line x1="555" y1="510" x2="430" y2="308" stroke="#245f84" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrowBlue)"/>
  <text x="446" y="468" class="small">chat events, approval events, done</text>

  <line x1="1150" y1="745" x2="430" y2="360" stroke="#245f84" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrowBlue)"/>
  <text x="846" y="766" class="small">terminal output bytes to browser WS</text>

  <line x1="430" y1="360" x2="980" y2="690" stroke="#8d3922" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrowRed)"/>
  <text x="620" y="650" class="small">human clicks Take control -> `Takeover(&quot;human&quot;)`</text>

  <text x="70" y="930" class="small">Draft v1 constraints: adapter owns cursor semantics, browser and agent share PTY through epoch takeover, crash recovery cleans up stale process groups but does not restore live sessions.</text>
</svg>
